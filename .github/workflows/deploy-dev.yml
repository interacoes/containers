name: Deploy Environment

on:
  repository_dispatch:
    types: [frontend-updated]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Checkout da branch, verificando qual branch foi disparada
      - name: Checkout Containers repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.client_payload.branch }}  # Vai pegar a branch do payload
          submodules: 'recursive'
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          fetch-depth: 0

      # Passo 2: Atualizar o submódulo do frontend conforme a branch
      - name: Update frontend submodule
        run: |
          git submodule update --init --recursive --remote --force
          cd frontend
          git fetch origin ${{ github.event.client_payload.branch }}  # Faz fetch da branch correta
          git checkout ${{ github.event.client_payload.branch }}  # Faz checkout da branch correta
          git pull origin ${{ github.event.client_payload.branch }}
          ls

      # Passo 3: Deploy no servidor, dependendo da branch
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Configura o git para usar SSH
            git config --global url."git@github.com:".insteadOf "https://github.com/"
            
            # Navega para o diretório correto baseado na branch
            if [ "${{ github.event.client_payload.branch }}" == "develop" ]; then
              cd /var/www/develop
              compose_files="-f docker-compose.yaml -f docker-compose.develop.yml"
            elif [ "${{ github.event.client_payload.branch }}" == "test" ]; then
              cd /var/www/test
              compose_files="-f docker-compose.yaml -f docker-compose.teste.yml"
            else
              cd /var/www/main
              compose_files="-f docker-compose.yaml -f docker-compose.prod.yml"
            fi
            
            # Atualiza o repositório e submódulos no servidor
            git checkout ${{ github.event.client_payload.branch }}
            git pull origin ${{ github.event.client_payload.branch }}
            git submodule update --init --recursive --remote
            
            # Rebuild e restart dos containers
            docker compose $compose_files up -d --build --force-recreate
              git pull origin main
              git config --global url."git@github.com:".insteadOf "https://github.com/"
              docker compose -f docker-compose.yaml -f docker-compose.prod.yml up -d --build
            fi
